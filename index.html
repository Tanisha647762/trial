<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanisha's Photography</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }
    header {
      background: #222;
      color: white;
      text-align: center;
      padding: 30px 0;
    }
    header h1 {
      font-size: 2.5em;
      margin: 0;
    }
    nav {
      background: #444;
      display: flex;
      justify-content: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      padding: 14px 20px;
    }
    nav a:hover {
      background: #666;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 30px;
    }
    .gallery img {
      width: 100%;
      border-radius: 10px;
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Trail Photography</h1>
    <p>Capturing moments, creating memories ✨</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Gallery</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <section class="gallery">
    <img src="https://picsum.photos/400/300?random=1" alt="Photo 1">
    <img src="https://picsum.photos/400/300?random=2" alt="Photo 2">
    <img src="https://picsum.photos/400/300?random=3" alt="Photo 3">
    <img src="https://picsum.photos/400/300?random=4" alt="Photo 4">
    <img src="https://picsum.photos/400/300?random=5" alt="Photo 5">
  </section>

  <footer>
    <p>&copy; 2026 Trail Photography | Made with ❤️</p>
  </footer>
</body>
</html>
